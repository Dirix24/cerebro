name: Cerebro - entrenamiento local de prueba
on:
  workflow_dispatch:
    inputs:
      pasos_numpy:
        description: 'Pasos de entrenamiento NumPy (máximo recomendado en runner: 300)'
        required: false
        default: '100'
        type: choice
        options: ['30', '100', '300']
  push:
    branches: [main, integracion-entrenamiento-neuronal, integracion-capacidades-cerebro, fase-1-historial-y-herramientas]
    paths:
      - 'cerebro_torch.py'
      - 'cerebro.py'
      - 'chat.py'
      - 'aprendizaje_internet.py'
      - 'core/**'
      - 'tests/**'
      - 'config.py'
      - '.github/workflows/entrenamiento-cerebro.yml'
  pull_request:
    branches: [main, integracion-entrenamiento-neuronal, integracion-capacidades-cerebro]
jobs:
  entrenar-y-probar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arquitectura: [clasica, avanzada]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Pruebas originales y memoria
        run: |
          python tests/tests_final.py
          python -m pytest -q tests/test_conocimiento.py tests/test_aprendizaje_internet.py tests/test_entrenamiento_guiado.py tests/test_capacidades_locales.py tests/test_herramientas_texto.py tests/test_repaso_local.py tests/test_historial_local.py tests/test_ejemplos_aprobados.py tests/test_exportar_ejemplos.py tests/test_monitor_neuronal.py tests/test_aprendizaje_semanal.py
      - name: Pruebas de componentes
        run: python -m pytest -q tests/test_nuevas_capacidades.py tests/test_cerebro_torch.py tests/test_local_search.py
      - name: Causalidad, reanudación y chat de Reasoning V3
        if: matrix.arquitectura == 'avanzada'
        run: python -m pytest -q tests/test_reasoning_v3.py
      - name: Entrenamiento propio de prueba
        run: |
          python cerebro_torch.py --corpus data/corpus.txt --perfil diminuto --arquitectura ${{ matrix.arquitectura }} --pasos 2 --batch 1 --acumulacion 2 --guardar-cada 1 --salida checkpoints/smoke-${{ matrix.arquitectura }}.pt --dispositivo cpu
          python cerebro_torch.py --corpus data/corpus.txt --perfil diminuto --arquitectura ${{ matrix.arquitectura }} --pasos 1 --batch 1 --acumulacion 2 --resume --salida checkpoints/smoke-${{ matrix.arquitectura }}.pt --dispositivo cpu
          python cerebro_torch.py --generar "Hola" --salida checkpoints/smoke-${{ matrix.arquitectura }}.pt --max-tokens 3
      - name: Guardar pesos de prueba como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-smoke-${{ matrix.arquitectura }}
          path: checkpoints/smoke-${{ matrix.arquitectura }}.pt
          retention-days: 7

  entrenar-numpy-validado:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias de entrenamiento NumPy
        run: python -m pip install numpy pytest
      - name: Validar núcleo y datos antes de entrenar
        run: python -m pytest -q tests/test_plan_y_motores.py tests/test_motores_laboratorio_pdf.py tests/test_criterio.py
      - name: Entrenar mini con validación y selección del mejor checkpoint
        run: python train.py --tamano mini --pasos ${{ inputs.pasos_numpy }} --batch 2 --semilla 1234
      - name: Conservar checkpoints para revisión manual
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cerebro-numpy-entrenado-${{ github.run_id }}
          path: |
            checkpoints/best.npz
            checkpoints/last.npz
          if-no-files-found: error
          retention-days: 14
